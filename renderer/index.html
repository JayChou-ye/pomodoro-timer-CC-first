<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🍅 番茄钟</h1>
    </header>

    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="pomodoro">专注</button>
      <button class="mode-btn" data-mode="shortBreak">短休息</button>
      <button class="mode-btn" data-mode="longBreak">长休息</button>
    </div>

    <div class="timer-ring">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="88" />
        <circle class="ring-progress" cx="100" cy="100" r="88" />
      </svg>
      <div class="timer-display">
        <span class="time" id="timeDisplay">25:00</span>
        <span class="label" id="statusLabel">准备开始</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn primary" id="btnStart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
        <span>开始</span>
      </button>
      <button class="ctrl-btn danger" id="btnReset">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
        <span>重置</span>
      </button>
    </div>

    <div class="task-input">
      <input type="text" id="taskName" placeholder="当前任务是什么？" maxlength="60">
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-num" id="todayCount">0</span>
        <span class="stat-label">今日番茄</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="todayMinutes">0</span>
        <span class="stat-label">专注分钟</span>
      </div>
      <div class="stat-item">
        <span class="stat-num" id="totalCount">0</span>
        <span class="stat-label">累计番茄</span>
      </div>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
